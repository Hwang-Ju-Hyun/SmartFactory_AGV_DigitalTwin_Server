<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">RobotProtocol Connection Flow</title>
  <desc id="desc">Layered connection flow for Unity legacy protocol and ESP32 RobotProtocol registration.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .client { fill: #eff6ff; stroke: #2563eb; }
      .server { fill: #ecfdf5; stroke: #059669; }
      .unity { fill: #f5f3ff; stroke: #7c3aed; }
      .robot { fill: #fff7ed; stroke: #f97316; }
      .decision { fill: #fef3c7; stroke: #d97706; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .h { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .txt { font: 400 14px Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, sans-serif; fill: #64748b; }
      .tag { font: 700 12px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="54" y="58">Connection Sequence</text>
  <text class="subtitle" x="54" y="86">Unity and ESP32 connect to the same server, but enter different protocol branches.</text>

  <rect class="panel client" x="56" y="142" width="240" height="432" rx="12"/>
  <text class="h" x="92" y="184">External Clients</text>
  <rect class="node" x="92" y="236" width="168" height="62" rx="8"/>
  <text class="tag" x="132" y="262">Unity</text>
  <text class="small" x="116" y="282">Digital Twin Viewer</text>
  <rect class="node" x="92" y="386" width="168" height="62" rx="8"/>
  <text class="tag" x="115" y="412">ESP32 / FakeRobot</text>
  <text class="small" x="118" y="432">Robot Client</text>

  <rect class="panel server" x="372" y="108" width="260" height="518" rx="12"/>
  <text class="h" x="414" y="150">Server Startup</text>
  <rect class="node" x="416" y="204" width="172" height="48" rx="8"/>
  <text class="tag" x="437" y="233">CreateSimulationWorld</text>
  <rect class="node" x="416" y="288" width="172" height="48" rx="8"/>
  <text class="tag" x="455" y="317">StartSimulation</text>
  <rect class="node" x="416" y="372" width="172" height="54" rx="8"/>
  <text class="tag" x="448" y="398">Server-owned</text>
  <text class="small" x="465" y="416">AGV entities</text>
  <path class="arrow" d="M 502 252 L 502 288"/>
  <path class="arrow" d="M 502 336 L 502 372"/>

  <rect class="panel unity" x="708" y="108" width="210" height="250" rx="12"/>
  <text class="h" x="746" y="150">Unity Branch</text>
  <rect class="node" x="742" y="192" width="142" height="38" rx="8"/>
  <text class="tag" x="775" y="216">UPT_HELLO</text>
  <rect class="node" x="742" y="250" width="142" height="38" rx="8"/>
  <text class="tag" x="759" y="274">HELLO_ACK</text>
  <rect class="node" x="742" y="308" width="142" height="38" rx="8"/>
  <text class="tag" x="756" y="332">Map + Create</text>
  <path class="arrow" d="M 813 230 L 813 250"/>
  <path class="arrow" d="M 813 288 L 813 308"/>

  <rect class="panel robot" x="708" y="410" width="390" height="216" rx="12"/>
  <text class="h" x="748" y="452">RobotProtocol Branch</text>
  <rect class="node" x="742" y="486" width="120" height="38" rx="8"/>
  <text class="tag" x="780" y="510">HELLO</text>
  <rect class="node" x="890" y="486" width="120" height="38" rx="8"/>
  <text class="tag" x="918" y="510">Validate</text>
  <rect class="decision" x="905" y="558" width="90" height="44" rx="22"/>
  <text class="tag" x="925" y="585">Accept?</text>
  <rect class="node" x="1034" y="486" width="120" height="38" rx="8"/>
  <text class="tag" x="1057" y="510">ACK OK</text>
  <rect class="node" x="1034" y="558" width="120" height="38" rx="8"/>
  <text class="tag" x="1049" y="582">ACK Error</text>
  <path class="arrow" d="M 862 505 L 890 505"/>
  <path class="arrow" d="M 950 524 L 950 558"/>
  <path class="arrow" d="M 995 580 L 1034 580"/>
  <path class="arrow" d="M 995 580 C 1016 542 1016 505 1034 505"/>

  <path class="arrow" d="M 260 267 C 410 267 540 211 742 211"/>
  <path class="arrow" d="M 260 417 C 400 417 570 505 742 505"/>
  <path class="arrow dash" d="M 588 399 C 650 430 694 486 742 505"/>
  <text class="small" x="558" y="445">requestedAgvID lookup</text>
</svg>
