<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Route Execution Flow</title>
  <desc id="desc">Layered route execution flow from task planning to robot route command, status reporting, server pose sync, and Unity replication.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .plan { fill: #ecfdf5; stroke: #059669; }
      .bridge { fill: #f5f3ff; stroke: #7c3aed; }
      .robot { fill: #fff7ed; stroke: #f97316; }
      .unity { fill: #eff6ff; stroke: #2563eb; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .h { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .tag { font: 700 12px Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, sans-serif; fill: #64748b; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="54" y="58">Route Execution Sequence</text>
  <text class="subtitle" x="54" y="86">The server plans globally, the robot executes locally, and Unity renders the server-owned pose.</text>

  <rect class="panel plan" x="54" y="142" width="250" height="420" rx="12"/>
  <text class="h" x="92" y="184">Server Planning</text>
  <rect class="node" x="92" y="236" width="174" height="44" rx="8"/><text class="tag" x="118" y="263">TaskManager</text>
  <rect class="node" x="92" y="306" width="174" height="44" rx="8"/><text class="tag" x="117" y="333">RoutePlanner</text>
  <rect class="node" x="92" y="376" width="174" height="54" rx="8"/><text class="tag" x="110" y="400">PathFinder</text><text class="small" x="122" y="418">ReservationTable</text>
  <rect class="node" x="92" y="456" width="174" height="44" rx="8"/><text class="tag" x="113" y="483">RobotManager</text>
  <path class="arrow" d="M179 280 L179 306"/><path class="arrow" d="M179 350 L179 376"/><path class="arrow" d="M179 430 L179 456"/>

  <rect class="panel bridge" x="380" y="142" width="250" height="420" rx="12"/>
  <text class="h" x="430" y="184">Robot Bridge</text>
  <rect class="node" x="418" y="236" width="174" height="54" rx="8"/><text class="tag" x="443" y="260">ESP32Robot</text><text class="small" x="458" y="278">Controller</text>
  <rect class="node" x="418" y="330" width="174" height="54" rx="8"/><text class="tag" x="463" y="354">RobotSession</text><text class="small" x="450" y="372">Send / Process</text>
  <rect class="node" x="418" y="432" width="174" height="54" rx="8"/><text class="tag" x="443" y="456">Map pose sync</text><text class="small" x="446" y="474">node + progress</text>
  <path class="arrow" d="M505 290 L505 330"/><path class="arrow" d="M505 384 L505 432"/>

  <rect class="panel robot" x="706" y="142" width="250" height="420" rx="12"/>
  <text class="h" x="760" y="184">ESP32 Runtime</text>
  <rect class="node" x="744" y="236" width="174" height="44" rx="8"/><text class="tag" x="774" y="263">ROUTE_COMMAND</text>
  <rect class="node" x="744" y="316" width="174" height="54" rx="8"/><text class="tag" x="771" y="340">RouteExecutor</text><text class="small" x="765" y="358">RobotStateMachine</text>
  <rect class="node" x="744" y="416" width="174" height="44" rx="8"/><text class="tag" x="802" y="443">STATUS</text>
  <rect class="node" x="744" y="492" width="174" height="44" rx="8"/><text class="tag" x="798" y="519">ARRIVED</text>
  <path class="arrow" d="M831 280 L831 316"/><path class="arrow" d="M831 370 L831 416"/><path class="arrow" d="M831 370 C870 400 870 458 831 492"/>

  <rect class="panel unity" x="1016" y="222" width="140" height="260" rx="12"/>
  <text class="h" x="1044" y="264">Unity</text>
  <rect class="node" x="1038" y="306" width="96" height="44" rx="8"/><text class="tag" x="1053" y="333">RT_UPDATE</text>
  <rect class="node" x="1038" y="390" width="96" height="44" rx="8"/><text class="tag" x="1055" y="417">Render</text>
  <path class="arrow" d="M1086 350 L1086 390"/>

  <path class="arrow" d="M266 478 C320 478 330 263 418 263"/>
  <path class="arrow" d="M592 357 C650 357 668 258 744 258"/>
  <path class="arrow" d="M744 438 C660 438 650 459 592 459"/>
  <path class="arrow" d="M918 514 C1020 610 1040 520 1086 434"/>
  <path class="arrow dash" d="M592 459 C730 650 970 560 1038 328"/>
  <text class="small" x="620" y="638">STATUS updates server object, then server sends replication to Unity.</text>
</svg>
