<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AGV Fleet Control System Architecture</title>
  <desc id="desc">Central server controls AGV world and route planning. Unity renders the digital twin. ESP32 and FakeRobot connect through the same RobotProtocol.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .server { fill: #ecfdf5; stroke: #059669; }
      .unity { fill: #eff6ff; stroke: #2563eb; }
      .robot { fill: #fff7ed; stroke: #f97316; }
      .fake { fill: #f1f5f9; stroke: #64748b; }
      .protocol { fill: #f5f3ff; stroke: #7c3aed; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .h { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .txt { font: 400 15px Arial, sans-serif; fill: #334155; }
      .small { font: 400 13px Arial, sans-serif; fill: #64748b; }
      .label { font: 700 13px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrow2 { stroke: #334155; stroke-width: 2.5; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 6; }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="54" y="58">AGV Fleet Control System</text>
  <text class="subtitle" x="54" y="86">Server-authoritative control with Unity Digital Twin and ESP32 robot clients</text>

  <rect class="panel unity" x="54" y="160" width="250" height="260" rx="10"/>
  <text class="h" x="84" y="205">Unity</text>
  <text class="txt" x="84" y="234">Digital Twin Viewer</text>
  <rect class="pill" x="84" y="265" width="184" height="34" rx="17"/>
  <text class="small" x="104" y="287">render AGV pose</text>
  <rect class="pill" x="84" y="311" width="184" height="34" rx="17"/>
  <text class="small" x="104" y="333">show map/object state</text>
  <rect class="pill" x="84" y="357" width="184" height="34" rx="17"/>
  <text class="small" x="104" y="379">no hardware control</text>

  <rect class="panel server" x="418" y="125" width="360" height="390" rx="10"/>
  <text class="h" x="454" y="172">Central Server</text>
  <text class="txt" x="454" y="200">Authoritative world and fleet logic</text>

  <rect class="pill" x="462" y="232" width="270" height="38" rx="8"/>
  <text class="label" x="486" y="256">TaskManager / DispatchManager</text>
  <rect class="pill" x="462" y="286" width="270" height="38" rx="8"/>
  <text class="label" x="486" y="310">RoutePlanner / ReservationTable</text>
  <rect class="pill" x="462" y="340" width="270" height="38" rx="8"/>
  <text class="label" x="486" y="364">RobotSession</text>
  <rect class="pill" x="462" y="394" width="270" height="38" rx="8"/>
  <text class="label" x="486" y="418">Replication to Unity</text>
  <rect class="pill" x="462" y="448" width="270" height="38" rx="8"/>
  <text class="label" x="486" y="472">Map / AGV entity ownership</text>

  <rect class="panel robot" x="900" y="140" width="246" height="180" rx="10"/>
  <text class="h" x="930" y="184">ESP32 Robot</text>
  <text class="txt" x="930" y="212">Physical AGV client</text>
  <text class="small" x="930" y="247">WiFi / TCP</text>
  <text class="small" x="930" y="275">Motor / Encoder / Battery</text>

  <rect class="panel fake" x="900" y="380" width="246" height="180" rx="10"/>
  <text class="h" x="930" y="424">FakeRobot</text>
  <text class="txt" x="930" y="452">ESP32 emulator</text>
  <text class="small" x="930" y="487">Same packets as ESP32</text>
  <text class="small" x="930" y="515">Used before chassis arrives</text>

  <rect class="protocol" x="829" y="272" width="132" height="156" rx="8"/>
  <text class="label" x="852" y="316">Robot</text>
  <text class="label" x="841" y="340">Protocol</text>
  <line x1="853" y1="362" x2="937" y2="362" stroke="#a78bfa" stroke-width="2"/>
  <text class="small" x="852" y="391">HELLO</text>
  <text class="small" x="852" y="411">ROUTE</text>

  <path class="arrow2" d="M 304 260 C 354 260 365 250 418 250"/>
  <text class="label" x="316" y="235">Legacy TCP</text>
  <text class="small" x="315" y="255">map / replication</text>

  <path class="arrow2" d="M 778 334 C 798 334 809 334 829 334"/>
  <text class="label" x="789" y="310">route + status</text>

  <path class="arrow2" d="M 961 302 C 990 274 1000 246 900 230"/>
  <path class="arrow2" d="M 961 396 C 990 424 1000 452 900 470"/>

  <rect x="54" y="610" width="1092" height="84" rx="12" fill="#0f172a"/>
  <text x="92" y="645" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Key design decision</text>
  <text x="92" y="675" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1">Unity visualizes. ESP32 executes. Server owns the world, task dispatch, route planning, and reservations.</text>
</svg>
